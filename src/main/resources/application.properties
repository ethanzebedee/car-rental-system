spring.application.name=car-rental-system

# NOTE:
# - Do NOT set `spring.profiles.active` in this base configuration file.
#   Specify it via environment variable or JVM system property instead
#   (for example: -Dspring.profiles.active=dev for local development,
#   or prod/stage values in production).
# - Profile-specific datasource and DDL settings (e.g. H2, create-drop)
#   should be configured in `application-dev.properties`,
#   `application-prod.properties`, or other profile-specific files.

# JPA / Hibernate
spring.jpa.open-in-view=false

# Server
server.port=8080

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
